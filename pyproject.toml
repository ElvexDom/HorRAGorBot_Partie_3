[project]
name = "horragor-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "polars>=1.40.0",
    "pyspark>=4.1.1",
    "streamlit>=1.58.0",
    "faiss-cpu>=1.14.2",
    "psycopg2>=2.9.12",
    "sentence-transformers>=5.5.1",
    "fastapi>=0.136.3",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.2",
    "langgraph>=1.2.8",
    "langfuse>=4.13.2",
    "beautifulsoup4>=4.14.3",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/manual", ".venv"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["graph", "tools", "data_api", "main_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true
