[project]
name = "horragor-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "polars>=1.40.0",
    "pyspark>=4.1.1",
    "streamlit>=1.58.0",
    "faiss-cpu>=1.14.2",
    "psycopg2>=2.9.12",
    "sentence-transformers>=5.5.1",
    "fastapi>=0.136.3",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.2",
    "langgraph>=1.2.8",
    "langfuse>=4.13.2",
    "beautifulsoup4>=4.14.3",
    "sqlalchemy>=2.0.50",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

# torch (dépendance transitive de sentence-transformers, pour les embeddings
# FAISS) tire par défaut, sur Linux, toute une série de paquets nvidia-*
# (CUDA) même sans GPU -- plusieurs Go pour rien dans des conteneurs CPU-only.
# On force la variante CPU-only officielle de PyTorch, qui ne déclare aucune
# dépendance CUDA. Cf. https://docs.astral.sh/uv/guides/integration/pytorch/
#
# Environnements restreints à Windows (dev local) + Linux (Docker) : le lock
# universel par défaut inclut macOS, pour lequel l'index pytorch-cpu ne
# publie pas systématiquement de wheel, ce qui empêchait la résolution.
[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/manual", ".venv"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["graph", "tools", "data_api", "main_api", "auth"]

[tool.coverage.report]
fail_under = 80
show_missing = true
