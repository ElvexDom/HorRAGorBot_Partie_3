global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: horragor-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: horragor-data-api
    static_configs:
      - targets: ["data-api:8100"]

  - job_name: horragor-frontend
    static_configs:
      - targets: ["frontend:8502"]
